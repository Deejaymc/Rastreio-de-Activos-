services:
  # ─── REVERSE PROXY COM SSL AUTOMÁTICO (HTTPS) ──────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: tracking_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@rastreio.local}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public_net

  # ─── SERVIÇO BACKEND FASTAPI ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracking_api
    restart: unless-stopped
    env_file:
      - .env.cloud
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://tracking:tracking@postgres:5432/tracking}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - public_net
      - internal_net

  # ─── BANCO POSTGRESQL + POSTGIS + TIMESCALEDB ─────────────────────────────
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: tracking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracking}
      POSTGRES_USER: ${POSTGRES_USER:-tracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracking}
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracking} -d ${POSTGRES_DB:-tracking}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal_net

  # ─── CACHE E PUB/SUB REDIS ─────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: tracking_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal_net

  # ─── STREAMING KAFKA (HABILITÁVEL COM --profile streaming) ──────────────────
  kafka:
    image: bitnami/kafka:3.9
    container_name: tracking_kafka
    profiles: ["streaming"]
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - internal_net

# ─── REDES ISOLADAS ──────────────────────────────────────────────────────────
networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true

# ─── VOLUMES PERSISTENTES PARA DADOS ──────────────────────────────────────────
volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  kafka_data:

